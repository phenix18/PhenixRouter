# Sur un tag vX.Y.Z : construit les exécutables autonomes (Windows, Linux, macOS) et publie une Release.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-14, target: darwin-arm64 }
          - { os: macos-13, target: darwin-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: node scripts/build-exe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: phenixrouter-${{ matrix.target }}
          path: dist/phenixrouter-*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Empreintes SHA-256 et installeurs
        run: |
          cp packaging/windows/install.bat artifacts/install-windows.bat
          cp packaging/windows/uninstall.bat artifacts/uninstall-windows.bat
          cp packaging/unix/install.sh artifacts/install-unix.sh
          cp packaging/unix/uninstall.sh artifacts/uninstall-unix.sh
          cd artifacts && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
